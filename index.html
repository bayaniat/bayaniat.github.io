<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayaniat - بيانيات</title>
</head>
<body>
    
    <script>
        function redirectToSuitableLocale() {
            let lcoaleWithoutRegion = "en";
            if (navigator.language) {
                lcoaleWithoutRegion = navigator.language.substring(0, 2);
            }

            window.location.replace(`/${lcoaleWithoutRegion}`)
        }

        redirectToSuitableLocale();
    </script>

</body>
</html>
